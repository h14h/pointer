# fly.toml app configuration file generated for pointer on 2026-02-04T22:40:19-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pointer'
primary_region = 'ord'

[build]
  # When enabling Pro (Clerk + Convex), uncomment with your values. These are
  # PUBLIC publishable values (safe to commit), and they must be build args —
  # Vite inlines VITE_* into the client bundle at image build, so
  # `fly secrets` (runtime-only) can't supply them.
  # [build.args]
  #   VITE_CLERK_PUBLISHABLE_KEY = "pk_live_..."
  #   VITE_CONVEX_URL = "https://<deployment>.convex.cloud"

[env]
  HOSTNAME = "0.0.0.0"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
